name: Sync exam timetable data

on:
  schedule:
    - cron: "0 0 * * *" # 每天 08:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/sync_exams.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/exams.json src/data/meta.json
          git diff --cached --quiet || git commit -m "chore: update exam timetable data"
          git push
